name: Build Docker Images

# Publishes to GitHub Container Registry. Authentication is the workflow's own
# GITHUB_TOKEN — no external registry account and no long-lived secret to
# rotate. The `packages: write` permission below is what makes that token
# usable for pushing.
#
# Each image is built once per architecture on a runner of that architecture,
# pushed by digest, and the two digests are then joined into one manifest list.
#
# The previous version built linux/arm64 on an x86 runner under QEMU emulation,
# which runs roughly 5-10x slower than native, and carried no build cache at
# all — every tag re-downloaded ~1900 npm packages from scratch.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  # A release tag is made by `pnpm release`, which writes the same version into
  # package.json. The running server reports the package.json version, so a tag
  # that disagrees would publish images that name themselves wrongly.
  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Make release tags with pnpm release."
            exit 1
          fi

  build:
    name: ${{ matrix.app }} (${{ matrix.platform }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [webapp, server, sandbox-host]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      # No `ref:` — a tag push must build the tagged commit. The previous
      # version pinned `ref: main`, so a tag built whatever main happened to be
      # at that moment rather than the commit that was tagged.
      - uses: actions/checkout@v7

      - name: Resolve image name and platform slug
        run: |
          # GHCR rejects uppercase in image paths, and repository_owner
          # preserves the casing of the GitHub account.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vantik-${{ matrix.app }}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # Only the webapp declares these ARGs; passing them to the server
          # build would just warn about unconsumed build-args. Blank lines are
          # ignored, which is what the false branches produce.
          #
          # VANTIK_COMMIT is what makes the build id deterministic. .git is in
          # .dockerignore, so the build cannot read the commit itself; without
          # it the id falls through to the version plus a timestamp, and every
          # rebuild — including a re-run of this workflow on an unchanged
          # commit — gets a new id and tells every open client to reload for a
          # bundle that did not change.
          build-args: |
            ${{ matrix.app == 'webapp' && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
            ${{ matrix.app == 'webapp' && format('VANTIK_COMMIT={0}', github.sha) || '' }}
          # Scoped per app and platform so the four jobs do not evict each
          # other. mode=max keeps intermediate stages, which is what makes the
          # dependency-install layers reusable across runs.
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.app }} manifest
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [webapp, server, sandbox-host]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vantik-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag push also moves `latest`, which is what docker-compose.yaml pulls
      # when VANTIK_IMAGE_TAG is unset. A manual run from a branch does not.
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          tags=(-t "${IMAGE}:${{ github.ref_name }}")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ github.ref_name }}"
