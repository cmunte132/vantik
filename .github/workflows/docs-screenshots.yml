name: Docs screenshots

# Retakes the screenshots on the docs site from a release, so each release's
# docs show the UI that shipped in it. The release workflow calls this once its
# images are published.
#
# It boots the stack from that release's images, seeds the docs workspace and
# captures every page with the code in apps/e2e/screenshots (see the README
# there), and commits whatever changed to main. A commit pushed with the
# workflow's own token starts no other workflow, so it then starts the docs
# deploy itself.
#
# The capture code comes from the release tag too, so the seed and the pages it
# opens always match the images it runs against.

on:
  workflow_call:
    inputs:
      version:
        description: Release to capture, such as 2026.10.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release to capture, such as 2026.10.0
        type: string
        required: true

concurrency:
  group: docs-screenshots
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.e2e.yaml
  VANTIK_IMAGE_TAG: ${{ inputs.version }}

jobs:
  capture:
    name: Capture ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: |
          cp .env.example .env
          echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          $COMPOSE up -d --no-build --wait --wait-timeout 600

      - name: Install Chromium
        run: pnpm --filter @vantikhq/e2e exec playwright install --with-deps chromium

      - name: Capture the screenshots
        run: pnpm --filter @vantikhq/e2e screenshots

      # The images are copied onto main rather than committed on the tag, which
      # is not a branch. They are only added and replaced, never removed: main
      # may already hold a screenshot the release's capture does not know yet.
      - name: Commit the screenshots to main
        id: commit
        run: |
          git fetch origin main
          git worktree add ../main origin/main
          cp -R apps/docs/static/img/docs/. ../main/apps/docs/static/img/docs/
          cd ../main
          if [ -z "$(git status --porcelain apps/docs/static/img/docs)" ]; then
            echo "The screenshots have not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/static/img/docs
          git commit -m "Retake the docs screenshots for ${VANTIK_IMAGE_TAG}"
          # Someone may have pushed to main since the fetch.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::error::Could not push the screenshots to main."
          exit 1

      - name: Deploy the docs
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref main

      - name: Collect container logs
        if: failure()
        run: |
          $COMPOSE ps --all
          $COMPOSE logs --no-color --timestamps > compose.log
          tail -n 200 compose.log

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots-report
          path: |
            apps/e2e/screenshots-report
            apps/e2e/test-results
            compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes
