  /api/v1/products:
    get:
      summary: List products
      description: >-
        What this workspace ships. A product holds no code and no issues: it
        groups the modules, and the issues hang off those.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
      tags:
        - Product
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request parameters
        "401":
          description: Unauthorized
      tags:
        - Product

  /api/v1/products/{productId}:
    post:
      summary: Update product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Product
    delete:
      summary: Delete product
      description: Soft delete. The row stays and `deleted` is stamped.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Product

  /api/v1/modules:
    get:
      summary: List modules
      description: >-
        Where the code is: usually one repository, sometimes a path inside one,
        sometimes one service. Modules are flat — a module has no parent module.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
        "401":
          description: Unauthorized
      tags:
        - Module
    post:
      summary: Create module
      description: >-
        Send exactly one of `ownerTeamId` or `ownerProductId`. Sending both, or
        neither, is refused with 400 — and a check constraint in the database
        refuses the row as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: Two owners, or no owner
        "401":
          description: Unauthorized
      tags:
        - Module

  /api/v1/modules/{moduleId}:
    post:
      summary: Update module
      description: >-
        To move the owner, send the new owner and null for the old one. A change
        that would leave the module with two owners or none is refused.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: Two owners, or no owner
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Module
    delete:
      summary: Delete module
      description: >-
        Soft delete. The id is also removed from every `Capability.moduleIds`
        and `Issue.moduleIds` that held it, so nothing is left pointing at a
        module that no longer exists.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Module

  /api/v1/modules/{moduleId}/repos:
    get:
      summary: List the repositories of a module
      description: >-
        These rows are not replicated to clients, so every screen that shows
        them asks for them.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleRepo"
        "401":
          description: Unauthorized
      tags:
        - Module
    post:
      summary: Point a module at a repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRepoDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          description: Unauthorized
      tags:
        - Module

  /api/v1/modules/{moduleId}/repos/{moduleRepoId}:
    post:
      summary: Update a module repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
        - name: moduleRepoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRepoDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Module
    delete:
      summary: Unpoint a module from a repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
        - name: moduleRepoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Module

  /api/v1/capabilities:
    get:
      summary: List capabilities
      description: >-
        What the software does for the people who use it, as opposed to what it
        is built from. A capability is defined by the modules that hold its
        code, and belongs to no product directly.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          description: Unauthorized
      tags:
        - Capability
    post:
      summary: Create capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapabilityDto"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "400":
          description: Invalid request parameters
        "401":
          description: Unauthorized
      tags:
        - Capability

  /api/v1/capabilities/{capabilityId}:
    post:
