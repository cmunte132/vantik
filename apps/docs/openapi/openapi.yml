openapi: 3.0.0
info:
  title: Vantik
  description: AI First Project Management Tool
  version: 2026.10.1

servers:
  - url: "{origin}/api"
    description: >-
      Your Vantik instance, through the webapp. The webapp proxy removes the
      /api prefix and sends the request to the server.
    variables:
      origin:
        default: http://localhost:3000
        description: The address of the webapp on your instance.
  - url: http://localhost:3001
    description: >-
      The server, directly. The server has no /api prefix. Use this address on
      the host that runs the server.

paths:
  /v1/integration_definition/{integrationDefinitionId}:
    get:
      summary: Get integration definition by ID
      parameters:
        - name: integrationDefinitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDefinition"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Integration_definition

  /v1/integration_definition:
    get:
      summary: Get integration definitions by workspace ID
      parameters:
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace to read. If you do not send it, the server uses the
            workspace of your token.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationDefinition"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Integration_definition

  /v1/issue_comments:
    post:
      summary: Create an issue comment
      parameters:
        - name: issueId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueCommentDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueComment"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue_comments

  /v1/issue_comments/{issueCommentId}:
    delete:
      summary: Delete issue comment
      description: >-
        This call deletes a comment. The server keeps the row and sets its deleted
        date. The response is the deleted comment.
      parameters:
        - in: path
          name: issueCommentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueComment"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The comment does not exist, or you cannot see it.
      tags:
        - Issue_comments

    post:
      summary: Update issue comment
      parameters:
        - in: path
          name: issueCommentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueCommentDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueComment"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue_comments

  /v1/issue_relation/{issueRelationId}:
    delete:
      summary: Delete issue relation
      parameters:
        - in: path
          name: issueRelationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueRelation"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue_relation

  /v1/issues:
    post:
      summary: Create issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue

  /v1/issues/{issueId}:
    get:
      summary: Get issue
      description: >-
        This call returns one issue with its team. The response also holds the
        description as Markdown in descriptionMarkdown.
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueWithTeam"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The issue does not exist, or you cannot see it.
      tags:
        - Issue

    post:
      summary: Update issue
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
        - in: query
          name: teamId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue

    delete:
      summary: Delete issue
      description: Only a workspace admin can delete an issue.
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
        - in: query
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: The caller is not a workspace admin.
      tags:
        - Issue

  /v1/issues/filter:
    post:
      summary: Get issues by filter
      description: >-
        This call reads issues, so an agent token needs only the read scope. If
        the request has none of page, perPage, orderBy and view, the response is
        an array of all the issues that match. If the request has one of them, the
        response is one page of issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetIssuesByFilterDTO"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/PaginatedIssues"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue

  /v1/issues/{issueId}/move:
    post:
      summary: Move issue to team
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequestParamsDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue

  /v1/products:
    get:
      summary: List products
      description: >-
        What this workspace ships. A product holds no code and no issues. It
        groups the modules, and each issue belongs to a module.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Product
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Product

  /v1/products/{productId}:
    post:
      summary: Update product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Product
    delete:
      summary: Delete product
      description: The server keeps the row and sets `deleted`.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Product

  /v1/modules:
    get:
      summary: List modules
      description: >-
        Where the code is. A module is usually one repository. It can also be a
        path in a repository, or one service. The modules are flat, and a module
        has no parent module.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Module
    post:
      summary: Create module
      description: >-
        Send `ownerTeamId` or `ownerProductId`, and send one of them only. If
        you send both, or if you send neither, the server refuses the request
        with a 400. A check constraint in the database refuses the row too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: Two owners, or no owner
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Module

  /v1/modules/{moduleId}:
    post:
      summary: Update module
      description: >-
        To change the owner, send the new owner, and send null for the old
        owner. The server refuses a change that gives the module two owners, and
        it refuses a change that gives the module no owner.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: Two owners, or no owner
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Module
    delete:
      summary: Delete module
      description: >-
        The server keeps the row and sets its deleted date. The server also removes the id from every
        `Capability.moduleIds` and every `Issue.moduleIds` that held it. No
        record then points at a module that does not exist.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Module

  /v1/modules/{moduleId}/repos:
    get:
      summary: List the repositories of a module
      description: >-
        The server does not replicate these rows to a client. Each screen that
        shows them therefore asks for them.
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleRepo"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Module
    post:
      summary: Point a module at a repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModuleRepoDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Module

  /v1/modules/{moduleId}/repos/{moduleRepoId}:
    post:
      summary: Update a module repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
        - name: moduleRepoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleRepoDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Module
    delete:
      summary: Unpoint a module from a repository
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
        - name: moduleRepoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleRepo"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Module

  /v1/capabilities:
    get:
      summary: List capabilities
      description: >-
        What the software does for the people who use it. This is not the same
        as the parts that the software is built from. The modules that hold the
        code of a capability define that capability. A capability belongs to no
        product directly.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Capability
    post:
      summary: Create capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapabilityDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Capability

  /v1/capabilities/{capabilityId}:
    post:
      summary: Update capability
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCapabilityDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Capability
    delete:
      summary: Delete capability
      description: The server keeps the row and sets its deleted date. An issue that named it keeps the id.
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Capability

  /v1/labels:
    get:
      summary: Get labels
      description: >-
        This call returns all the labels of the workspace.
      parameters:
        - in: query
          name: workspaceId
          required: false
          description: >-
            The workspace to read. If you do not send it, the server uses the
            workspace of your token.
          schema:
            type: string
        - in: query
          name: teamId
          required: false
          description: >-
            The server does not filter on this value. A team of another
            workspace gets a 404.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Labels

    post:
      summary: Create label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Labels

  /v1/labels/{labelId}:
    post:
      summary: Update label
      parameters:
        - in: path
          name: labelId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLabelDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Labels

    delete:
      summary: Delete label
      parameters:
        - in: path
          name: labelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Labels

  /v1/users/pat:
    post:
      summary: Create personal access token (PAT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Users

  /v1/users/pats/{patId}:
    delete:
      summary: Delete personal access token (PAT)
      parameters:
        - in: path
          name: patId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Users

  /v1/users:
    get:
      summary: Get user
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Users

  /v1/{teamId}/workflows:
    get:
      summary: Get workflows
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Teams

  /v1/issues/number/{issueNumber}:
    get:
      summary: Get issue by number
      description: >-
        This call returns the issue that has this number in the given team. Use it to
        find an issue from its key, for example ENG-42.
      parameters:
        - in: path
          name: issueNumber
          required: true
          description: The number part of the issue key, without the team identifier.
          schema:
            type: integer
        - in: query
          name: teamId
          required: true
          description: The id of the team that owns the issue.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueWithTeam"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The team does not exist, or you cannot see it.
        "500":
          description: >-
            No issue in the team has this number. For this case the server
            sends a 500, not a 404.
      tags:
        - Issue

  /v1/issues/{issueId}/context:
    get:
      summary: Get issue context
      description: >-
        This call returns all the context of one issue in one request. The
        response holds the description, the Definition of Done, comments,
        history and relations. Each id comes with a readable name.
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueContext"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The issue does not exist, or you cannot see it.
      tags:
        - Issue

  /v1/issues/export:
    get:
      summary: Export issues as CSV
      description: >-
        This call returns all issues of the workspace as a CSV file. The file holds
        only issues in teams that you can see. Deleted issues are not in the
        file.
      responses:
        "200":
          description: >-
            A CSV file with the columns Number, Title, Description, State,
            Labels, Priority, Parent Issue, Created At, Updated At, Created By,
            Team and Assignee.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="issues.csv"
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Issue

  /v1/issues/{issueId}/subscribe:
    post:
      summary: Subscribe to issue
      description: >-
        This call adds you to the subscribers of an issue, or removes you. Set type to
        SUBSCRIBE or UNSUBSCRIBE.
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeIssueInput"
      responses:
        "201":
          description: The updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The issue does not exist, or you cannot see it.
      tags:
        - Issue

  /v1/checklist_items:
    get:
      summary: List Definition of Done criteria
      description: >-
        This call returns the criteria of the Definition of Done of an issue. The list
        is in sort order, then in order of creation. Deleted criteria are not
        in the list.
      parameters:
        - in: query
          name: issueId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The issue does not exist, or you cannot see it.
      tags:
        - Definition of Done
    post:
      summary: Add Definition of Done criterion
      description: >-
        This call adds a criterion to the Definition of Done of an issue. Without
        sortOrder, the criterion goes to the end of the list. A criterion that
        you create as completed records you as the person who completed it.
      parameters:
        - in: query
          name: issueId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklistItemDto"
      responses:
        "201":
          description: The new criterion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The issue does not exist, or you cannot see it.
      tags:
        - Definition of Done

  /v1/checklist_items/{checklistItemId}:
    post:
      summary: Update Definition of Done criterion
      description: >-
        This call changes the text, the position or the completed state of a criterion.
        When completed changes, the server records who changed it and when.
        Send only the fields that you change.
      parameters:
        - in: path
          name: checklistItemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemDto"
      responses:
        "201":
          description: The updated criterion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The criterion does not exist, or you cannot see it.
      tags:
        - Definition of Done
    delete:
      summary: Delete Definition of Done criterion
      description: >-
        This call deletes a criterion. The server keeps the row and sets its deleted
        date. The response is the deleted criterion.
      parameters:
        - in: path
          name: checklistItemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: The criterion does not exist, or you cannot see it.
      tags:
        - Definition of Done

  /v1/agent_runs:
    get:
      summary: List agent runs
      description: >-
        This call returns the agent runs of the workspace, newest first. Filter by
        issue, agent, status or executor. Pages hold 50 runs by default and
        200 runs at most. An agent token sees only the runs of its own agent.
      parameters:
        - in: query
          name: issueId
          required: false
          schema:
            type: string
        - in: query
          name: agentUserId
          required: false
          description: The id of the agent user that the run works as.
          schema:
            type: string
        - in: query
          name: status
          required: false
          description: >-
            One or more run statuses. The server accepts only a repeated
            parameter, for example status=FAILED&status=CANCELED. A single
            status=FAILED gets a 400. For one status, send the parameter two
            times, for example status=FAILED&status=FAILED.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AgentRunStatus"
        - in: query
          name: executor
          required: false
          description: The executor key, for example hosted.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: perPage
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
          description: >-
            The number of runs on a page. The server uses 200 for a larger
            value.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunPage"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Agent_runs

  /v1/pages:
    get:
      summary: List pages
      description: >-
        This call returns the pages of the workspace. The order is by
        sortOrder, then by creation date. Send summary=true to
        leave out the bodies. Then each page has a null description, an empty
        descriptionMarkdown and null sections.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: parentId
          in: query
          required: false
          description: Only the children of this page. Omit it to get all pages.
          schema:
            type: string
        - name: summary
          in: query
          required: false
          description: Send "true" to leave out the page bodies.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Pages
    post:
      summary: Create page
      description: >-
        This call creates a page. Send the body as descriptionMarkdown. A GENERATED page
        must have a question and no body. The server then builds its body from
        the knowledge in its scope.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/related:
    get:
      summary: List pages linked to an entity
      description: >-
        This call returns the pages that have a link to one team, project, issue, page,
        product, module or capability.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: entityType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PageLinkTypeEnum"
        - name: entityId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedPage"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Pages

  /v1/pages/{pageId}:
    get:
      summary: Get page
      description: >-
        This call returns one page with its body as markdown. The ancestors field holds
        the parent pages, root first.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageWithAncestors"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages
    post:
      summary: Update page
      description: >-
        This call changes the fields that you send. You cannot edit the body of a
        GENERATED page. A person can send kind AUTHORED to take the page over,
        and then edit it. An agent token cannot do this.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePageDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
      tags:
        - Pages
    delete:
      summary: Delete page
      description: >-
        This call deletes the page, all the pages below it and all their
        entries. The server keeps the rows and sets their deleted date. The
        response is the deleted page.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/backlinks:
    get:
      summary: List issues that mention a page
      description: >-
        This call returns the issues whose description contains the page id, for
        example a pasted page URL. The response holds at most 50 issues, the most
        recently updated first.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageBacklink"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/links:
    get:
      summary: List page links
      description: >-
        This call returns the teams, projects, issues, pages, products, modules and
        capabilities that this page has a link to. A link to a deleted target
        does not come back.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace to read. If you do not send it, the server uses the
            workspace of your token.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageLink"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages
    post:
      summary: Create page link
      description: >-
        This call links the page to a team, project, issue, page, product, module or
        capability. If the link is there already, the call returns it. A page
        cannot link to itself.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace to read. If you do not send it, the server uses the
            workspace of your token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageLinkDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageLink"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/links/{linkId}:
    delete:
      summary: Delete page link
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: linkId
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace to read. If you do not send it, the server uses the
            workspace of your token.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the deleted link.
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/history:
    get:
      summary: Get page history
      description: >-
        This call returns the newest 50 changes to the page, newest first. Each change
        holds the body as it was before the change, as markdown.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageRevision"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/revert/{historyId}:
    post:
      summary: Revert page body
      description: >-
        This call puts the body back to what it was before one recorded change. The
        revert records its own change, so you can revert it too. The change
        must be a change to the body.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: historyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: The change did not touch the body
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/consolidate:
    post:
      summary: Propose page consolidation
      description: >-
        This call proposes a new page body that folds STANDING entries into it. Nothing
        changes until a person accepts the proposal. You cannot consolidate
        into a GENERATED page.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidatePageDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProposal"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/proposals:
    get:
      summary: List page proposals
      description: >-
        This call returns the newest 50 proposals for the page, newest first. By default
        only OPEN proposals come back. Send state=ALL for all proposals.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: An unknown value is the same as OPEN.
          schema:
            type: string
            enum: [OPEN, ACCEPTED, DECLINED, ALL]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageProposal"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Pages

  /v1/pages/{pageId}/proposals/{proposalId}/accept:
    post:
      summary: Accept page proposal
      description: >-
        This call writes the proposed body to the page and marks the folded entries
        CONSOLIDATED. An agent token cannot call this. The call fails if the
        page changed after the proposal, or an entry is no longer STANDING.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: A person answered the proposal already, or the page or its entries changed
      tags:
        - Pages

  /v1/pages/{pageId}/proposals/{proposalId}/decline:
    post:
      summary: Decline page proposal
      description: >-
        This call declines an OPEN proposal. Nothing else changes. An agent token cannot
        call this.
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProposal"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: A person answered the proposal already
      tags:
        - Pages

  /v1/page_entries:
    get:
      summary: List page entries
      description: >-
        This call returns entries, newest first, each with its proof and its trail of
        moves, inbox decisions and triage decisions. All filters are optional.
        A list filter accepts one value, a comma-separated list or a repeated
        parameter.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: pageId
          in: query
          required: false
          schema:
            type: string
        - name: loose
          in: query
          required: false
          description: Send true for only the entries that are on no page.
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PageEntryStatusEnum"
        - name: moduleIds
          in: query
          required: false
          description: Entries that apply to one or more of these modules.
          schema:
            type: array
            items:
              type: string
        - name: ids
          in: query
          required: false
          description: Only these entries.
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: The maximum number of entries. There is no limit by default.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageEntry"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Page_entries
    post:
      summary: Create page entry
      description: >-
        This call writes one claim. With pageId, the entry goes on that page. Without
        pageId, the entry is loose and must have a scope. An entry from an
        agent always starts PROPOSED. An agent cannot write to a LOCKED page.
        On a CURATED page or a loose scope, one token can have at most 10
        PROPOSED entries by default. The server refuses a repeat of a known
        entry unless you send supersedesId or distinct. The server checks each
        citation before it writes the entry.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: pageId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageEntryDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEntry"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: The page is LOCKED, or the token has too many PROPOSED entries
        "404":
          description: Not found
        "409":
          description: The entry repeats a known entry
        "422":
          description: The content looks like it holds a credential, or a citation does not hold
      tags:
        - Page_entries

  /v1/page_entries/bulk:
    post:
      summary: Triage page entries in bulk
      description: >-
        This call sets one status on a set of entries. The server skips an entry when its
        current status does not allow the change. An agent token cannot call
        this. Triage is for people.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdatePageEntriesDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdatePageEntriesResult"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
      tags:
        - Page_entries

  /v1/page_entries/move:
    post:
      summary: Move page entries
      description: >-
        This call files entries under a page and records each move on the entry. The
        server skips CONSOLIDATED entries and entries that are on the page
        already. An agent token cannot call this.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePageEntriesDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovePageEntriesResult"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
      tags:
        - Page_entries

  /v1/page_entries/{pageEntryId}:
    post:
      summary: Update page entry
      description: >-
        This call changes the fields that you send. An agent can only edit or archive its
        own PROPOSED entries. An agent cannot verify an entry. Nothing can go
        back to PROPOSED, and a SUPERSEDED entry cannot change status.
      parameters:
        - name: pageEntryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePageEntryDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEntry"
        "400":
          description: Invalid request parameters, or a status change that the server does not allow
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: The content looks like it holds a credential
      tags:
        - Page_entries

  /v1/knowledge/search:
    get:
      summary: Search knowledge
      description: >-
        This call searches the page bodies and the entries that the knowledge bank serves.
        The response holds only STANDING and CONSOLIDATED entries. If no page
        or entry matches, the server records the query as a knowledge gap.
        The default limit is 20.
      parameters:
        - name: query
          in: query
          required: true
          description: >-
            The question. It must not be empty. The server refuses the value "*".
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: The workspace. If you do not send it, the server uses the workspace of the session.
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          required: false
          description: >-
            Only facts about this repository path, team or project. A path also
            includes the facts about its parent paths and its child paths.
            The response always includes entries with no scope.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            The maximum number of hits. The default is 20. The server ignores
            a value that is not a positive integer.
          schema:
            type: integer
            default: 20
        - name: kind
          in: query
          required: false
          description: >-
            Only these kinds of entry. Send a list with commas, or send the
            parameter more than one time. With this filter, the response holds
            no page bodies.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PageEntryKindEnum"
          style: form
          explode: false
        - name: moduleIds
          in: query
          required: false
          description: >-
            Put knowledge about these modules, and about their neighbour
            modules, at the top. This parameter changes the order only. It does
            not remove hits. Send a list with commas.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: false
        - name: issueId
          in: query
          required: false
          description: Put knowledge about the modules and the capability of this issue at the top.
          schema:
            type: string
            format: uuid
        - name: x-vantik-session
          in: header
          required: false
          description: >-
            The session of the agent harness. The server records it with each
            entry that it serves. The server ignores a value longer than 200
            characters.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResult"
        "400":
          description: Invalid query parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Knowledge

  /v1/knowledge/context:
    post:
      summary: Load a context pack
      description: >-
        This call returns the knowledge that applies to a piece of work, in the limit of a
        token budget. This call is a read. An agent token needs only the read
        scope. The server never records a knowledge gap for this call.
      parameters:
        - name: x-vantik-session
          in: header
          required: false
          description: >-
            The session of the agent harness. The server records it with each
            entry that it serves. The server ignores a value longer than 200
            characters.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeContextDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPack"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Knowledge

  /v1/knowledge/similar:
    get:
      summary: Find similar knowledge entries
      description: >-
        This call finds up to 5 entries that are near to a fact before you write it.
        The response also holds PROPOSED entries. A near match is a hint. It
        does not stop the write.
      parameters:
        - name: content
          in: query
          required: true
          description: The text of the fact that you are about to write.
          schema:
            type: string
        - name: pageId
          in: query
          required: false
          description: >-
            The page that the fact goes on. If you do not send a page, the
            server looks for near matches in the full workspace.
          schema:
            type: string
            format: uuid
        - name: workspaceId
          in: query
          required: false
          description: The workspace. If you do not send it, the server uses the workspace of the session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchHit"
        "400":
          description: Invalid query parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Knowledge

  /v1/knowledge/gaps:
    get:
      summary: List knowledge gaps
      description: >-
        This call lists the questions that a search did not answer. The most frequent
        question is first. The list holds only open gaps, and holds a maximum
        of 50.
      parameters:
        - name: workspaceId
          in: query
          required: false
          description: The workspace. If you do not send it, the server uses the workspace of the session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeGap"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Knowledge

  /v1/teams:
    get:
      summary: List teams
      description: >-
        This call returns the teams in the workspace that you can read. A member gets the
        teams that they are in. A workspace admin gets all the teams.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Teams
    post:
      summary: Create team
      description: >-
        Only a workspace admin can call this. The server adds you, all the
        workspace admins and all the bot users to the new team. It also makes
        the default workflow states. If `preferences.teamType` is `support`,
        the team gets the support workflow states.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
      tags:
        - Teams

  /v1/teams/{teamId}:
    post:
      summary: Update team
      description: >-
        This call changes the name, the identifier or the icon of a team. You must be in
        the team, or you must be a workspace admin.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Teams
    delete:
      summary: Delete team
      description: >-
        Only a workspace admin can call this. The server keeps the row and
        sets `deleted`. The server refuses to delete a team that
        has issues. The server also removes the team from all memberships.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: The team has issues
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
      tags:
        - Teams

  /v1/teams/{teamId}/preferences:
    post:
      summary: Update team preferences
      description: >-
        This call merges the fields that you send into the preferences of the team. The
        fields that you do not send keep their values. You must be in the team,
        or you must be a workspace admin.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamPreferencesDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Teams

  /v1/teams/{teamId}/members:
    get:
      summary: List team members
      description: >-
        This call returns the workspace memberships of the people in the team, with
        their user records. You must be in the team, or you must be a
        workspace admin.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsersOnWorkspaces"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Teams

  /v1/teams/{teamId}/add-member:
    post:
      summary: Add team member
      description: >-
        Only a workspace admin can call this. This call adds a member of the
        workspace to the team. If the person is in the team already, nothing changes.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersOnWorkspaces"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
      tags:
        - Teams

  /v1/teams/{teamId}/remove-member:
    post:
      summary: Remove team member
      description: >-
        Only a workspace admin can call this. This call removes a person from
        the team.
        The server refuses the request if the person has assigned issues in
        the team.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersOnWorkspaces"
        "400":
          description: Invalid request parameters, or the person has assigned issues in the team
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Forbidden
      tags:
        - Teams

  /v1/projects:
    get:
      summary: List projects
      description: >-
        This call returns the projects in the workspace. The list does not include
        deleted projects.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Project
    post:
      summary: Create project
      description: >-
        If you send no `status`, the server sets it to `Backlog`. If you send
        no `teams`, the project belongs to all the teams. Each team id and
        each capability id must be in the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: A team or a capability is not in the workspace
      tags:
        - Project

  /v1/projects/{projectId}:
    post:
      summary: Update project
      description: >-
        This call changes only the fields that you send. A `teams` or a
        `capabilityIds` list replaces the current list.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Project
    delete:
      summary: Delete project
      description: >-
        The server keeps the rows and sets `deleted` on the project and on its
        milestones. It also removes the project and the milestone from each
        issue in the project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Project

  /v1/projects/{projectId}/milestone:
    post:
      summary: Create project milestone
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectMilestoneDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMilestone"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Project

  /v1/projects/milestone/{projectMilestoneId}:
    post:
      summary: Update project milestone
      parameters:
        - name: projectMilestoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMilestoneDto"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMilestone"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Project
    delete:
      summary: Delete project milestone
      description: >-
        The server keeps the rows and sets `deleted` on the milestone. It also
        removes the milestone from each issue that has it. The issues stay in
        the project.
      parameters:
        - name: projectMilestoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMilestone"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Not found
      tags:
        - Project

  /v1/search:
    get:
      summary: Search issues
      description: >-
        This call finds issues by words, by semantic similarity and by issue number, for example
        `ENG-12`. The results are in order of relevance. You get only issues
        in the teams that you can see.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace to search. You must be a member of it. If you send
            none, the server uses the workspace of your session.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The maximum number of results, from 1 to 100.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: threshold
          in: query
          required: false
          description: >-
            The maximum cosine distance for a semantic match, from 0 to 2. A
            lower value gives fewer, closer matches.
          schema:
            type: number
            default: 0.8
            minimum: 0
            maximum: 2
        - name: stateCategory
          in: query
          required: false
          description: >-
            A comma-separated list of workflow categories. Send it to get only
            issues in these categories.
          schema:
            type: string
            example: COMPLETED,CANCELED
        - name: moduleIds
          in: query
          required: false
          description: >-
            A comma-separated list of module ids. An issue matches if it names
            one of these modules. The server ignores a module of another
            workspace.
          schema:
            type: string
        - name: capabilityId
          in: query
          required: false
          description: >-
            One capability id. An issue matches if it delivers this capability.
            The server ignores a capability of another workspace.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueSearchHit"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Search

  /v1/search/similar_issues:
    get:
      summary: Find similar issues
      description: >-
        This call returns up to 10 issues that are semantically similar to the issue that you
        name. The list does not include that issue. If the server cannot find
        the issue, the list is empty.
      parameters:
        - name: issueId
          in: query
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          description: >-
            The workspace of the issue. You must be a member of it. If you send
            none, the server uses the workspace of your session.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueSearchHit"
        "400":
          description: Invalid request parameters
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
      tags:
        - Search

components:
  schemas:
    IntegrationAccount:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        integrationConfiguration:
          type: object
          nullable: true
        accountId:
          type: string
          nullable: true
        settings:
          type: object
          nullable: true
        personal:
          type: boolean
        isActive:
          type: boolean
        integratedBy:
          $ref: "#/components/schemas/User"
        integratedById:
          type: string
        integrationDefinition:
          $ref: "#/components/schemas/IntegrationDefinition"
        integrationDefinitionId:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
        workspaceId:
          type: string

    IntegrationDefinition:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        spec:
          $ref: "#/components/schemas/Spec"
        clientId:
          type: string
        clientSecret:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
        workspaceId:
          type: string
          nullable: true
        IntegrationAccount:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationAccount"

    Spec:
      type: object
      properties:
        workspace_auth:
          type: object
          properties:
            OAuth2:
              $ref: "#/components/schemas/OAuth2Params"
        personal_auth:
          type: object
          properties:
            OAuth2:
              $ref: "#/components/schemas/OAuth2Params"
        other_data:
          type: object
          # Define properties based on the actual JsonObject type

    OAuth2Params:
      type: object
      properties:
        authorization_url:
          type: string
        authorization_params:
          type: object
          # Define properties based on the actual Record<string, string> type
        default_scopes:
          type: array
          items:
            type: string
        scope_separator:
          type: string
        token_url:
          type: string
        token_params:
          type: object
          # Define properties based on the actual Record<string, string> type
        redirect_uri_metadata:
          type: array
          items:
            type: string
        token_response_metadata:
          type: array
          items:
            type: string
        token_expiration_buffer:
          type: integer
        scopes:
          type: array
          items:
            type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        usersOnWorkspaces:
          type: array
          items:
            $ref: "#/components/schemas/UsersOnWorkspaces"
        team:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        label:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        template:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        syncAction:
          type: array
          items:
            $ref: "#/components/schemas/SyncAction"
        integrationAccount:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationAccount"
        integrationDefinition:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationDefinition"
        View:
          type: array
          items:
            $ref: "#/components/schemas/View"
        aiRequests:
          type: array
          items:
            $ref: "#/components/schemas/AIRequest"
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"

    UsersOnWorkspaces:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
        userId:
          type: string
        workspaceId:
          type: string
        teamIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, INVITED]
        externalAccountMappings:
          type: object
          nullable: true
          # Define properties based on the actual JsonValue type
        role:
          type: string
          enum: [ADMIN, MEMBER, GUEST]
        joinedAt:
          type: string
          format: date-time
          nullable: true

    Team:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        identifier:
          type: string
        icon:
          type: string
          nullable: true
        workspace:
          $ref: "#/components/schemas/Workspace"
        workspaceId:
          type: string
        issue:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        label:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        template:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        workflow:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        teamPreference:
          type: array
          items:
            $ref: "#/components/schemas/TeamPreference"
        View:
          type: array
          items:
            $ref: "#/components/schemas/View"

    Template:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        category:
          type: string
          enum: [ISSUE, COMMENT]
        templateData:
          type: object
          # Define properties based on the actual JsonValue type
        createdBy:
          $ref: "#/components/schemas/User"
        createdById:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
        workspaceId:
          type: string
        team:
