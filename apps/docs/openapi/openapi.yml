    PageEntryStatusEnum:
      type: string
      description: >-
        PROPOSED entries wait for triage. Retrieval serves STANDING entries.
        The page body holds the facts of CONSOLIDATED entries. A newer entry
        replaces a SUPERSEDED entry. Retrieval holds back DISPUTED entries.
        ARCHIVED entries are out of use.
      enum: [PROPOSED, STANDING, CONSOLIDATED, SUPERSEDED, DISPUTED, ARCHIVED]

