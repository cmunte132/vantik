          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        body:
          type: string
        userId:
          type: string
          nullable: true
        updatedById:
          type: string
        sourceMetadata:
          type: object
          nullable: true
        reactionsData:
          type: array
          items:
            type: object
        issueId:
          type: string
        parentId:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            type: string

    Issue:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
        number:
          type: integer
        description:
          type: string
          nullable: true
        priority:
          type: integer
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
          nullable: true
        subIssueSortOrder:
          type: integer
          nullable: true
        estimate:
          type: integer
          nullable: true
        sourceMetadata:
          type: object
          nullable: true
        isBidirectional:
          type: boolean
          nullable: true
        teamId:
          type: string
        createdById:
          type: string
          nullable: true
        updatedById:
          type: string
        subscriberIds:
          type: array
          items:
            type: string
        assigneeId:
          type: string
          nullable: true
        labelIds:
          type: array
          items:
            type: string
        stateId:
          type: string
        parentId:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            type: string
        issueSuggestionId:
          type: string
          nullable: true
        moduleIds:
          type: array
          description: >-
            The modules this issue changes. An issue can touch more than one,
            and the list can be empty.
          items:
            type: string
        capabilityId:
          type: string
          description: The capability this issue delivers. One, or none.
          nullable: true

    Product:
      type: object
      description: >-
        A thing the company ships. Before this model a team was the only thing
        that could stand for a product, and a company shipping two things needed
        two workspaces. A team is still the permission boundary, still holds the
        cycles, and still namespaces the issue numbers.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        key:
          type: string
          description: A short name, for example "cloud". Unique in the workspace.
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        leadUserId:
          type: string
          nullable: true
        workspaceId:
          type: string

    CreateProductDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        key:
          type: string
          description: The server makes one from the name if you send none.
        description:
          type: string
        status:
          type: string
        icon:
          type: string
        color:
          type: string
        leadUserId:
          type: string

    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        description:
          type: string
        status:
          type: string
        icon:
          type: string
        color:
          type: string
        leadUserId:
          type: string

    Module:
      type: object
      description: >-
        Usually one repository, sometimes a path inside one, sometimes one
        service. A module has exactly one owner, a team or a product. The linked
        lists name the other teams and products that use it, and a link carries
        no authority.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        key:
          type: string
          description: A short name, for example "server". Unique in the workspace.
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        leadUserId:
          type: string
          nullable: true
        ownerTeamId:
          type: string
          nullable: true
        ownerProductId:
          type: string
          nullable: true
        linkedTeamIds:
          type: array
          items:
            type: string
        linkedProductIds:
          type: array
          items:
            type: string
        workspaceId:
          type: string

    CreateModuleDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        key:
          type: string
          description: The server makes one from the name if you send none.
        description:
          type: string
        status:
          type: string
        icon:
          type: string
        color:
          type: string
        leadUserId:
          type: string
        ownerTeamId:
          type: string
          description: >-
            Send this or ownerProductId, never both and never neither.
        ownerProductId:
          type: string
        linkedTeamIds:
          type: array
          items:
            type: string
        linkedProductIds:
          type: array
          items:
            type: string

    UpdateModuleDto:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        description:
          type: string
        status:
          type: string
        icon:
          type: string
        color:
          type: string
        leadUserId:
          type: string
        ownerTeamId:
          type: string
          description: To move the owner, send the new one and null for the old.
          nullable: true
        ownerProductId:
          type: string
          nullable: true
        linkedTeamIds:
          type: array
          items:
            type: string
        linkedProductIds:
          type: array
          items:
            type: string

    ModuleRepo:
      type: object
      description: >-
        Where the code of a module is. An empty `pathPrefixes` means the module
        is the whole repository; a monorepo becomes several modules on one
        repository, each with its own prefixes.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        moduleId:
          type: string
        integrationAccountId:
          type: string
          nullable: true
        externalRepoId:
          type: string
        fullName:
          type: string
          description: '"owner/name" on the provider.'
        pathPrefixes:
          type: array
          items:
            type: string
        bidirectional:
          type: boolean
        isDefault:
          type: boolean

    CreateModuleRepoDto:
      type: object
      required:
        - externalRepoId
        - fullName
      properties:
        externalRepoId:
          type: string
        fullName:
          type: string
        integrationAccountId:
          type: string
        pathPrefixes:
          type: array
          items:
            type: string
        bidirectional:
          type: boolean
        isDefault:
          type: boolean

    UpdateModuleRepoDto:
      type: object
      properties:
        pathPrefixes:
          type: array
          items:
            type: string
        bidirectional:
          type: boolean
        isDefault:
          type: boolean

    Capability:
      type: object
      description: >-
        Something the software does for the people who use it. Defined by the
        modules that hold its code, and belonging to no product directly — one
        capability can span modules owned by several products.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: planned, active, live or deprecated.
        moduleIds:
          type: array
