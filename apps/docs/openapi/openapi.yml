      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      tags:
        - Capability
    delete:
      summary: Delete capability
      description: Soft delete. Issues that named it keep the id.
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema:
