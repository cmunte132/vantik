          nullable: true
        helpfulCount:
          type: number
        harmfulCount:
          type: number
        contentHash:
          type: string
          nullable: true
        corroborationCount:
          type: integer
        workspaceId:
          type: string
        pageId:
          type: string
          nullable: true
          description: Null for a loose entry.
        trust:
          type: string
          enum: [HUMAN_VERIFIED, GROUNDED, OBSERVED, PROVISIONAL, UNGROUNDED]
        citations:
          type: array
          items:
            $ref: "#/components/schemas/PageEntryCitation"
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedSha:
          type: string
          nullable: true
        moves:
          type: array
          description: Only in a list response.
          items:
            $ref: "#/components/schemas/PageEntryMove"
        inboxItems:
          type: array
          description: Only in a list response.
          items:
            $ref: "#/components/schemas/PageEntryInboxDecision"
        triage:
          type: array
          description: Only in a list response.
          items:
            $ref: "#/components/schemas/PageEntryTriageStep"

    CreatePageEntryDto:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: One short claim, as markdown.
        scope:
          type: string
          description: The repository path glob, team or project that the claim applies to. Required for a loose entry.
        kind:
          $ref: "#/components/schemas/PageEntryKindEnum"
        sourceSession:
          type: string
          description: A session id from the harness, to trace the claim to a run.
        supersedesId:
          type: string
          description: The entry that this entry replaces.
        distinct:
          type: boolean
          description: Send true to say that the entry is different from the similar entries that the server found.
        standing:
          type: boolean
          description: Send true to start the entry as STANDING. The server ignores it for an agent.
        citations:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PageEntryCitationInputDto"

    UpdatePageEntryDto:
      type: object
      properties:
        content:
          type: string
        scope:
          type: string
        kind:
          $ref: "#/components/schemas/PageEntryKindEnum"
        status:
          $ref: "#/components/schemas/PageEntryStatusEnum"
        verified:
          type: boolean
          description: Only a person can send this.

    BulkUpdatePageEntriesDto:
      type: object
      required:
        - entryIds
        - status
      properties:
        entryIds:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PageEntryStatusEnum"

    BulkUpdatePageEntriesResult:
      type: object
      properties:
        updated:
          type: integer
        skipped:
          type: integer

    MovePageEntriesDto:
      type: object
      required:
        - entryIds
        - pageId
      properties:
        entryIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        pageId:
          type: string
          description: The page that the entries go under.
        suggested:
          type: boolean
          description: Send true when a person accepts a suggestion from the gardener.

    MovePageEntriesResult:
      type: object
      properties:
        moved:
          type: array
          items:
            type: string
        skipped:
          type: integer

    KnowledgeTrustEnum:
      type: string
      description: >-
        HUMAN_VERIFIED: a person confirmed it. GROUNDED: accepted, and each
        citation holds. OBSERVED: accepted, and it rests on an outside page that
        the server read. PROVISIONAL: in use, but nothing confirms it yet.
        UNGROUNDED: all other entries.
      enum:
        - HUMAN_VERIFIED
        - GROUNDED
        - OBSERVED
        - PROVISIONAL
        - UNGROUNDED

    ServedCitation:
      type: object
      description: The evidence for an entry, and the result of the last check of it.
      required:
        - kind
        - result
        - checkedAt
        - checkedSha
      properties:
        kind:
          type: string
          enum:
            - CODE
            - ISSUE
            - PULL_REQUEST
            - COMMENT
            - RUN
            - URL
        repo:
          type: string
          nullable: true
          description: CODE only. The full name of the repository.
        path:
          type: string
          nullable: true
          description: CODE only. The path from the root of the repository.
        commitSha:
          type: string
          nullable: true
          description: CODE only. The commit of the cited lines.
        lines:
          type: string
          nullable: true
          description: CODE only. The cited lines at the last check, for example "40-52".
        target:
          type: string
          nullable: true
          description: >-
            All kinds other than CODE. The issue key, the pull request URL, the
            comment id, the run id or the page URL.
        result:
          type: string
          nullable: true
          enum:
            - HOLDS
            - MOVED
            - CHANGED
            - MISSING
            - UNKNOWN
        checkedAt:
          type: string
          format: date-time
          nullable: true
        checkedSha:
          type: string
          nullable: true
        judgment:
          type: string
          nullable: true
          description: CHANGED only. The decision of the judge model.
          enum:
            - HOLDS
            - CONTRADICTED
            - UNCLEAR
        judgeModel:
          type: string
          nullable: true

    KnowledgeSearchHit:
      type: object
      description: >-
        One page body or one entry. A page body has kind "page", no entryId and
        a null trust.
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - page
            - entry
        pageId:
          type: string
          nullable: true
          description: Null for an entry that is on no page.
        pageTitle:
          type: string
        entryId:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
        scope:
          type: string
          nullable: true
        status:
          type: string
          description: The status of the entry. A page body is always STANDING.
          enum:
            - PROPOSED
            - STANDING
            - CONSOLIDATED
            - SUPERSEDED
            - DISPUTED
            - ARCHIVED
        sourceUserId:
          type: string
          nullable: true
        verified:
          type: boolean
        retrievalCount:
          type: integer
        entryKind:
          allOf:
            - $ref: "#/components/schemas/PageEntryKindEnum"
          nullable: true
        moduleIds:
          type: array
          items:
            type: string
        evidenceFor:
          type: object
          nullable: true
          description: For a CONSOLIDATED entry, the page whose body holds its fact.
          properties:
            pageId:
              type: string
            pageTitle:
              type: string
        distance:
          type: number
          description: The vector distance from the query. Only present for a vector match.
        relevanceScore:
          type: number
          description: 1 minus the distance. Only present for a vector match.
        trust:
          allOf:
            - $ref: "#/components/schemas/KnowledgeTrustEnum"
          nullable: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/ServedCitation"
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest check of a citation.
        lastCheckedSha:
          type: string
          nullable: true
          description: The commit of the latest check of code.

    KnowledgeSearchResult:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchHit"
        facets:
          type: object
          description: >-
            The number of matches for each value of a field. The fields are
            sourceUserId, scope, status, kind and entryKind.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        found:
          type: integer
          description: >-
            The number of groups that match. A group is a page, or a scope for
            entries on no page.

    KnowledgeContextDto:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The workspace. If you do not send it, the server uses the workspace of the session.
        query:
          type: string
          description: >-
            The work that you are about to do, in free text. If you do not send
            a query, the server uses the scope as the query.
        scope:
          type: string
          description: Only facts about this repository path, team or project.
        tokenBudget:
          type: number
          default: 2000
          minimum: 1
          maximum: 20000
          description: >-
            The maximum number of tokens in the pack. The default is 2000. The
            server changes a value above 20000 to 20000.
        moduleIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            The modules of the work. Knowledge about them, and about their
            neighbour modules, goes to the top.
        issueId:
          type: string
          format: uuid
          description: The issue of the work. Its modules and its capability set the order.

    ContextPack:
      type: object
      description: >-
        Items in order of relevance. PROVISIONAL entries come after all other
        items, and the pack holds a maximum of 2 of them.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchHit"
        estimatedTokens:
          type: integer
          description: The estimated tokens of the pack. The estimate is 4 characters for each token.
        tokenBudget:
          type: integer
          description: The budget that the server applied.
        omitted:
          type: integer
          description: The number of matches that did not go into the pack.

    KnowledgeGap:
      type: object
      properties:
        query:
          type: string
        count:
          type: integer
          description: How many times a search asked this question.
        lastAskedAt:
          type: string
          format: date-time

    CreateTeamDto:
      type: object
      required:
        - name
        - identifier
      properties:
        name:
          type: string
        identifier:
          type: string
          description: The prefix of the issue numbers in the team, for example "ENG".
        icon:
          type: string
        preferences:
          $ref: "#/components/schemas/UpdateTeamPreferencesDto"

    UpdateTeamDto:
      type: object
      properties:
        name:
          type: string
        identifier:
          type: string
        icon:
          type: string

    UpdateTeamPreferencesDto:
      type: object
      properties:
        cyclesEnabled:
          type: boolean
        cyclesMode:
          type: string
          enum: [auto, manual]
          description: >-
            With `auto`, the server makes, closes and continues the cycles. With
            `manual`, a person makes each cycle.
        autoRolloverDestination:
          type: string
          enum: [next-cycle, backlog]
          description: >-
            Where the unfinished issues go when the server closes a cycle. Only
            the `auto` mode uses it.
        cyclesFrequency:
          type: number
          description: The length of a cycle, in weeks.
        upcomingCycles:
          type: number
          description: The number of future cycles that the server keeps.
        teamType:
          type: string
          enum: [engineering, support]
          description: The workflow states that a new team gets. Only creation uses it.

    TeamMemberDto:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          description: Unique in the workspace.
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: >-
            Free text. If you send no status at creation, the server sets
            `Backlog`.
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        leadUserId:
          type: string
          nullable: true
        teams:
          type: array
          items:
            type: string
          description: >-
            The ids of the teams that work on the project. An empty list means
            that the project belongs to all the teams.
        capabilityIds:
          type: array
          items:
            type: string
          description: The capabilities that the project builds or changes.
        workspaceId:
          type: string

    ProjectMilestone:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          description: Unique in the project.
        description:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        projectId:
          type: string

    CreateProjectDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: Free text. The default is `Backlog`.
        startDate:
          type: string
        endDate:
          type: string
        leadUserId:
          type: string
        teams:
          type: array
          items:
            type: string
          description: Team ids. Send none to make the project belong to all the teams.
        capabilityIds:
          type: array
          items:
            type: string

    UpdateProjectDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        leadUserId:
          type: string
        teams:
          type: array
          items:
            type: string
          description: Replaces the list.
        capabilityIds:
          type: array
          items:
            type: string
          description: Replaces the list.

    CreateProjectMilestoneDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        endDate:
          type: string

    UpdateProjectMilestoneDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        endDate:
          type: string

    IssueSearchHit:
      type: object
      properties:
        id:
          type: string
          description: The issue id.
        title:
          type: string
        description:
          type: string
          description: The description as Tiptap JSON text. An empty string if the issue has no description.
        descriptionMarkdown:
          type: string
        descriptionString:
          type: string
          description: The indexed text of the description.
        stateId:
          type: string
        stateCategory:
          type: string
          enum: [TRIAGE, BACKLOG, UNSTARTED, STARTED, COMPLETED, CANCELED, ""]
        resolutionSnippet:
          type: string
          description: >-
            Up to 500 characters of the last top-level comment before the issue
            moved to a completed state. An empty string if there is no such comment.
        teamId:
          type: string
        number:
          type: integer
        issueNumber:
          type: string
          description: The team identifier and the number, for example "ENG-12".
        workspaceId:
          type: string
        assigneeId:
          type: string
          description: An empty string if nobody has the issue.
        distance:
          type: number
          description: >-
            The cosine distance to the query. The field is absent if the match
            is by words only.
        relevanceScore:
          type: number
          description: 1 minus `distance`. The field is absent when `distance` is absent.

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    UnauthorizedResponse:
      description: The request has no valid token or session.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorised

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

security:
  - BearerAuth: []
