    PageEntryPolicyEnum:
      type: string
      description: >-
        How the page controls new entries. On each policy, the server refuses
        a repeat of a known entry. On a CURATED page, each token has a limit of
        PROPOSED entries. An OPEN page has no such limit. On a LOCKED page, only
        people can write entries.
      enum: [OPEN, CURATED, LOCKED]

