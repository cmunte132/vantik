# Shared by every location that proxies to the server.

proxy_http_version 1.1;
# The browser's host, as the Next.js proxy passed it. The server builds links
# and checks origins against it.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Stream both ways. Some responses arrive a token at a time (AI writing), and
# uploads have no size limit, as before.
proxy_buffering off;
proxy_request_buffering off;
client_max_body_size 0;
proxy_read_timeout 1h;
