# Turn-key self-hosted Vantik.
#
#   cp .env.example .env      # defaults work out of the box; change secrets for real deployments
#   docker compose up -d
#
# Webapp on :3000, API on :3001. The server applies database migrations on startup.
#
# Uploaded files go to a disk, in the attachment-data volume, and that needs no
# configuration. To put them in object storage instead, set STORAGE_PROVIDER=s3
# and the settings beside it in .env. To try that first, start the MinIO in this
# file: docker compose --profile s3 up -d minio minio-bucket
#
# For local development, run the apps on the host and start only the backing
# services from this file:
#
#   docker compose up -d postgres redis
#   pnpm install && pnpm migrate && pnpm dev
#
# They publish their ports on localhost for exactly that — see "Local
# development" in README.md.
#
# Telemetry is off. To send it to a backend, write docker-compose.override.yaml
# beside this file. Set OTEL_EXPORTER_OTLP_ENDPOINT on the server there, and add
# the backend's own service if it runs in the stack. Compose loads the override
# file by itself, and .gitignore lists it, so the choice of backend stays yours
# and out of the repository. See "Observability" in README.md.
#
# Values in `environment:` blocks override .env where the in-container network
# differs from the host view (service names instead of localhost).
#
# Not included (optional — the server logs an error and continues without them):
#   - an LLM endpoint for the AI features — any OpenAI-compatible one, hosted or
#     local; point LLM_BASE_URL at it (see .env.example)
#   - SMTP — without it, magic-link login emails are printed to the server log
#     (docker compose logs server | grep -A5 "magic link")

name: vantik

services:
  webapp:
    container_name: vantik-webapp
    build:
      context: .
      dockerfile: ./apps/webapp/Dockerfile
      args:
        # The build stamp. .git is in .dockerignore, so the build cannot read the
        # commit itself and it has to be handed in:
        #
        #   VANTIK_BUILD_ID=$(git rev-parse --short HEAD) docker compose build
        #
        # Left unset, the build falls back to the release version plus a
        # timestamp, which is unique per build but says nothing about what is in
        # it. Setting it means rebuilding the same commit keeps the same stamp,
        # so clients that are already open are not told to reload for nothing.
        # `pnpm stack:rebuild` sets it.
        VANTIK_BUILD_ID: ${VANTIK_BUILD_ID:-}
        VANTIK_COMMIT: ${VANTIK_COMMIT:-}
    # Releases are published to GitHub Container Registry. Override REGISTRY to
    # pull from a fork's namespace; the default matches what CI publishes.
    # VANTIK_IMAGE_TAG pins a release, such as 2026.9.0; left unset, it is the
    # newest one.
    image: ${REGISTRY:-ghcr.io/cmunte132}/vantik-webapp:${VANTIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # nginx proxies /api/* to the backend from inside the container network
      # (apps/webapp/nginx.conf.template). It needs nothing else from .env:
      # the browser fetches its settings from the server at /api/v1/config.
      BACKEND_URL: http://server:3001
    ports:
      - "3000:3000"
    networks:
      - vantik

  server:
    container_name: vantik-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: ${REGISTRY:-ghcr.io/cmunte132}/vantik-server:${VANTIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # Read at runtime, not baked in: the server advertises this on every
      # response and to every socket that connects, so a client can see when the
      # two images are from different builds. It is never used to refuse a
      # request — an old client keeps working.
      VANTIK_BUILD_ID: ${VANTIK_BUILD_ID:-}
      DB_HOST: postgres
      REDIS_URL: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@postgres:5432/${POSTGRES_DB:-vantik}?schema=${DB_SCHEMA:-vantik}&sslmode=prefer
      OAUTH_CALLBACK_URL: ${FRONTEND_HOST:-http://localhost:3000}/api/v1/oauth/callback
      REPO_MIRROR_ROOT: /data/repos
      # Where the server finds the sandbox host, which starts the VMs that
      # hosted agent runs work in. The default is a sandbox host that runs
      # natively on this machine, as it must on macOS. Podman and Docker
      # Desktop both resolve host.docker.internal to that machine. With the
      # sandbox profile on Linux, set SANDBOX_HOST_CONTAINER_URL in .env to
      # http://sandbox-host:3004. SANDBOX_HOST_TOKEN comes from .env.
      SANDBOX_HOST_URL: ${SANDBOX_HOST_CONTAINER_URL:-http://host.docker.internal:3004}
    ports:
      - "3001:3001"
    volumes:
      # Attachments go to a disk unless STORAGE_PROVIDER says otherwise, so this
      # volume holds every uploaded file. It also holds the secret that signs
      # attachment URLs, which the server makes on first start. Remove the
      # volume and the files go with it.
      - attachment-data:/data/attachments
      # The server's own bare copy of every repository it works with, from any
      # source. Safe to remove: the server fetches each repository again.
      - repo-mirrors:/data/repos
      # Local repositories: LOCAL_REPO_ROOT in .env names the directory that
      # holds your checkouts, and it is mounted at the same path, so a path
      # that works on the host works here. The server fetches from those
      # repositories and pushes an agent's branch back into them, so the mount
      # is read-write. It never reads or changes a working tree. Do not set
      # LOCAL_REPO_ROOT to your home directory: the server could then reach
      # every file in it, for example ~/.ssh.
      #
      # With LOCAL_REPO_ROOT unset, an empty volume takes its place and no
      # local repository can be added.
      - ${LOCAL_REPO_ROOT:-no-local-repos}:${LOCAL_REPO_ROOT:-/data/no-local-repos}
    networks:
      - vantik
    healthcheck:
      # Readiness, not liveness: the webapp waits on this, and it must not
      # start against a server whose database or search index is unreachable.
      # /health/ready returns 503 until every dependency answers. The check
      # uses node, because the server image has no wget or curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then((r) => r.json()).then((b) => process.exit(b.status === 'ready' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Starts the microVMs that hosted agent runs work in, apart from the server.
  # It needs /dev/kvm, so it sits behind a profile and is for Linux hosts:
  #
  #   docker compose --profile sandbox up -d sandbox-host
  #
  # and SANDBOX_HOST_CONTAINER_URL=http://sandbox-host:3004 in .env. On macOS no
  # container gets hardware virtualisation; run the sandbox host natively with
  # `pnpm sandbox-host` instead. See "Hosted agent runs" in README.md.
  #
  # It publishes no port. Only the server, on this network, calls it.
  sandbox-host:
    container_name: vantik-sandbox-host
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: ./apps/sandbox-host/Dockerfile
    image: ${REGISTRY:-ghcr.io/cmunte132}/vantik-sandbox-host:${VANTIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      # Gondolin's guest images. Safe to remove: they download again.
      - sandbox-images:/home/node/.cache/gondolin
    networks:
      - vantik
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    container_name: vantik-postgres
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # The sync engine uses pgoutput and needs wal_level=logical.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      POSTGRES_DB: ${POSTGRES_DB:-vantik}
    ports:
      # bound to localhost only — for running the apps on the host during
      # development (see "Local development" in README.md)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - vantik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-vantik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: vantik-redis
    # 8.x rather than 7.x: 7.2 is still patched, but ships on an older Alpine
    # base and so carries more OS-level CVEs. Redis 8 reads a 7.x RDB, but once
    # it writes one, 7.x can no longer read it — a downgrade means discarding
    # the volume (it holds BullMQ job state, which regenerates).
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vantik
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Object storage that speaks the S3 protocol. It is not part of the default
  # stack — attachments go to a disk unless an operator sets STORAGE_PROVIDER —
  # so it sits behind a profile and starts only when it is asked for:
  #
  #   docker compose --profile s3 up -d minio minio-bucket
  #
  # Use it to try the S3 backend before you point it at a real store, and to run
  # the storage conformance tests against something other than a disk:
  #
  #   TEST_S3_ENDPOINT=http://127.0.0.1:9000 \
  #   TEST_S3_ACCESS_KEY_ID=vantik TEST_S3_SECRET_ACCESS_KEY=vantik-secret \
  #   TEST_S3_BUCKET=vantik-attachments \
  #     pnpm --filter server test -- storage-provider.conformance
  minio:
    container_name: vantik-minio
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vantik}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vantik-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - vantik
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO serves no bucket until one is made, and the server does not make its
  # own. This runs once and stops.
  minio-bucket:
    container_name: vantik-minio-bucket
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set vantik http://minio:9000 \
          "${MINIO_ROOT_USER:-vantik}" "${MINIO_ROOT_PASSWORD:-vantik-secret}"
        mc mb --ignore-existing "vantik/${BUCKET_NAME:-vantik-attachments}"
    networks:
      - vantik

networks:
  vantik:

volumes:
  postgres-data:
  redis-data:
  attachment-data:
  repo-mirrors:
  no-local-repos:
  minio-data:
  sandbox-images:
