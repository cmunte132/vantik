# Turn-key self-hosted Vantik.
#
#   cp .env.example .env      # defaults work out of the box; change secrets for real deployments
#   docker compose up -d
#
# Webapp on :3000, API on :3001. The server applies database migrations on startup.
#
# For local development, run the apps on the host and start only the backing
# services from this file:
#
#   docker compose up -d postgres redis supertokens typesense
#   pnpm install && pnpm migrate && pnpm dev
#
# They publish their ports on localhost for exactly that — see "Local
# development" in README.md.
#
# Values in `environment:` blocks override .env where the in-container network
# differs from the host view (service names instead of localhost).
#
# Not included (optional — the server logs an error and continues without them):
#   - trigger.dev (background actions/automations) — https://trigger.dev/docs/self-hosting
#   - ollama (local LLM fallback when no OPENAI/ANTHROPIC key is set)
#   - SMTP — without it, magic-link login emails are printed to the server log
#     (docker compose logs server | grep -A5 "magic link")

name: vantik

services:
  webapp:
    container_name: vantik-webapp
    build:
      context: .
      dockerfile: ./apps/webapp/Dockerfile
      args:
        # The build stamp. .git is in .dockerignore, so the build cannot read the
        # commit itself and it has to be handed in:
        #
        #   VANTIK_BUILD_ID=$(git rev-parse --short HEAD) docker compose build
        #
        # Left unset, the build falls back to VERSION plus a timestamp, which is
        # unique per build but says nothing about what is in it. Setting it means
        # rebuilding the same commit produces the same chunk URLs, so clients
        # that are already open are not made to reload for nothing.
        VANTIK_BUILD_ID: ${VANTIK_BUILD_ID:-}
        VANTIK_COMMIT: ${VANTIK_COMMIT:-}
    # Releases are published to GitHub Container Registry. Override REGISTRY to
    # pull from a fork's namespace; the default matches what CI publishes.
    image: ${REGISTRY:-ghcr.io/cmunte132}/vantik-webapp:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    env_file: .env
    environment:
      # The Next.js server proxies /api/* to the backend from inside the
      # container network. Browser-facing settings are not needed here: the
      # browser fetches them from the server at /api/v1/config.
      BACKEND_URL: http://server:3001
    ports:
      - "3000:3000"
    networks:
      - vantik

  server:
    container_name: vantik-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: ${REGISTRY:-ghcr.io/cmunte132}/vantik-server:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      typesense:
        condition: service_healthy
    env_file: .env
    environment:
      # Read at runtime, not baked in: the server advertises this on every
      # response and to every socket that connects, so a client can see when the
      # two images are from different builds. It is never used to refuse a
      # request — an old client keeps working.
      VANTIK_BUILD_ID: ${VANTIK_BUILD_ID:-}
      DB_HOST: postgres
      REDIS_URL: redis
      TYPESENSE_HOST: typesense
      SUPERTOKEN_CONNECTION_URI: http://supertokens:3567
      DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@postgres:5432/${POSTGRES_DB:-vantik}?schema=${DB_SCHEMA:-vantik}&sslmode=prefer
      REPLICATION_DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@postgres:5432/${POSTGRES_DB:-vantik}
      TRIGGER_DATABASE_URL: postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@postgres:5432/${TRIGGER_DB:-trigger}
      OAUTH_CALLBACK_URL: ${FRONTEND_HOST:-http://localhost:3000}/api/v1/oauth/callback
      TRIGGER_ACCESS_TOKEN: tr_pat_${TRIGGER_TOKEN:-}
    ports:
      - "3001:3001"
    networks:
      - vantik
    healthcheck:
      # Readiness, not liveness: the webapp waits on this, and it must not
      # start against a server whose database or search index is unreachable.
      # /health/ready returns 503 until every dependency answers, so wget's
      # non-zero exit on a 503 is the signal.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/ready | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    container_name: vantik-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    # wal_level=logical enables the built-in pgoutput logical decoding the
    # sync engine subscribes to; no postgres extensions are required.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      POSTGRES_DB: ${POSTGRES_DB:-vantik}
    ports:
      # bound to localhost only — for running the apps on the host during
      # development (see "Local development" in README.md)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - vantik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-vantik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: vantik-redis
    # 8.x rather than 7.x: 7.2 is still patched, but ships on an older Alpine
    # base and so carries more OS-level CVEs. Redis 8 reads a 7.x RDB, but once
    # it writes one, 7.x can no longer read it — a downgrade means discarding
    # the volume (it holds BullMQ job state, which regenerates).
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vantik
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  supertokens:
    container_name: vantik-supertokens
    # Pinned deliberately. An auth core that moves under us on every pull is a
    # liability, and the SDKs speak a specific CDI version: supertokens-node 24
    # needs CDI 5.3, which this core serves.
    image: supertokens/supertokens-postgresql:12.0.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-docker}@postgres:5432/${POSTGRES_DB:-vantik}"
    ports:
      - "127.0.0.1:3567:3567"
    networks:
      - vantik
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/3567'"]
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    container_name: vantik-typesense
    # 27.x → 30.x needs no reindex: v30 still supports downgrading to any
    # version above v27, so the on-disk format carries over. The v30 auto-
    # migration of synonyms/curation/analytics rules does not apply — none are
    # used here.
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-random_API_key}"]
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    networks:
      - vantik
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ok <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  vantik:

volumes:
  postgres-data:
  redis-data:
  typesense-data:
